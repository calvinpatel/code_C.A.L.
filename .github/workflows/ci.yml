name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cal
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: notepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cal -d notepilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cal:devpass@localhost:5432/notepilot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r practice/experiments/shipping_arc/l02_compose/requirements.txt

      - run: pip install pytest

      - run: pytest -v
        working-directory: practice/experiments/shipping_arc/l02_compose