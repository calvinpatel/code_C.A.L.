name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r experiments/shipping_arc/l02_compose/requirements.txt

      - run: pip install pytest

      - run: pytest experiments/shipping_arc/l02_compose/test_smoke.py