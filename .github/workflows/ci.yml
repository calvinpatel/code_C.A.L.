name: CI

on:
  push:
    paths:
      - "practice/experiments/shipping/shipping_arc/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cal
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: notepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cal -d notepilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cal:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/notepilot

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"

      - run: uv sync --locked
        working-directory: practice/experiments/shipping/shipping_arc/l05_lock

      - run: uv run pytest -v
        working-directory: practice/experiments/shipping/shipping_arc/l05_lock
