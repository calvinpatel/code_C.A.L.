services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: notepilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d notepilot"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
        - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://cal:devpass@db:5432/notepilot
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: